[package]
name = "pixelwid"
version = "0.1.0"
edition = "2021"
description = "A pixel-inspired floating clock and to-do widget for the desktop"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
