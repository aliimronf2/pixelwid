[package]
name = "pixelwid"
version = "0.1.0"
edition = "2021"
description = "A pixel-inspired floating clock and to-do widget for the desktop"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[profile.release]
opt-level = "z"     # Optimasi ukuran binary terkecil (gunakan "s" jika ingin sedikit lebih cepat)
lto = true          # Link Time Optimization: menghapus kode mati lintas crate
codegen-units = 1   # Mengoptimalkan seluruh binary sebagai satu kesatuan (lebih kecil)
panic = "abort"     # Menghapus stack unwinding info (menghemat ratusan KB hingga beberapa MB)
strip = true        # Membuang semua debug symbols dari file .exe